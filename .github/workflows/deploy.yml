# Test every push and pull request; deploy master to the VPS when it passes.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#
#   VPS_HOST       the VPS hostname or public IP, e.g. als.ardena.xyz
#   VPS_USER       als  — not root; see the note in the preflight step below
#   VPS_SSH_KEY    the deploy private key, whole file including the
#                  -----BEGIN/-----END lines. Its public half belongs in
#                  /home/als/.ssh/authorized_keys on the server.
#
# Optional:
#
#   VPS_PORT       if sshd does not listen on 22
#   VPS_HOST_KEY   the server's public host key line. Without it, the first
#                  connection of every run trusts whatever answers on that
#                  address — a window a network-level attacker can step into.
#                  The deploy prints the line to paste in; the trustworthy copy
#                  comes from the server itself:
#
#                      cat /etc/ssh/ssh_host_ed25519_key.pub
#
#                  and is stored as "<host> ssh-ed25519 AAAA...".
#
# Repository variables (same screen, Variables tab — these are not secrets):
#
#   PUBLIC_BASE_URL  the service's public origin, e.g. https://als.ardena.xyz
#                    Used only for the post-deploy readiness check. Needed when
#                    VPS_HOST is an IP, since https://<ip>/ fails certificate
#                    verification; defaults to https://$VPS_HOST otherwise.

name: CI and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One deploy at a time, and never cancel one halfway: an interrupted run can
# leave the server mid-migration with the old code still serving.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests, migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # The deploy runs `alembic upgrade head`. If a model gained a column and
      # nobody wrote the migration, that command succeeds without doing
      # anything and production quietly runs one column behind its own code.
      # Needs no database: the migrations are compiled to DDL, not executed.
      - name: Migrations match the models
        run: python scripts/check_migrations.py

  deploy:
    name: Deploy to the VPS
    needs: test
    # Pull requests get the tests and nothing else.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checked before anything is attempted, because the failure this replaces
      # was genuinely misleading: an unset VPS_HOST made `ssh-keyscan ""` exit 1
      # one line after a message about VPS_HOST_KEY, so the log blamed the
      # optional secret for the required one going missing.
      - name: Check the deploy secrets are set
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ]  || missing="$missing VPS_SSH_KEY"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Set them under Settings > Secrets and variables > Actions."
            echo "  VPS_HOST      the VPS hostname or IP, e.g. als.ardena.xyz"
            echo "  VPS_USER      als"
            echo "  VPS_SSH_KEY   the whole private key, BEGIN and END lines included"
            echo ""
            echo "Note the VPS_ prefix. Organisation-level secrets work too, but"
            echo "the repository has to be included in that secret's access list."
            exit 1
          fi

          # A key pasted without its header is the other quiet failure: the file
          # is written, ssh rejects it, and the error names the wrong thing.
          case "$VPS_SSH_KEY" in
            *"-----BEGIN"*) ;;
            *)
              echo "::error::VPS_SSH_KEY does not look like a private key."
              echo "Paste the whole file, including the -----BEGIN and -----END lines."
              exit 1
              ;;
          esac

          # Deploying as root is not how this server is set up, and the failure it
          # causes is delayed and confusing rather than immediate.
          #
          # Two concrete problems. The CI key is authorised in
          # /home/als/.ssh/authorized_keys and nowhere else, so as root it simply
          # will not authenticate. And if a root key *is* used, `git reset` and
          # `pip install` inside deploy.sh rewrite /opt/als-backend as root —
          # after which the service, which runs as `als`, can no longer read its
          # own virtualenv, and every later deploy as `als` fails on permissions.
          if [ "$VPS_USER" = "root" ]; then
            echo "::warning::VPS_USER is root. The units run as the 'als' user, whose sudo rights are limited to restarting two services. Running as root re-owns /opt/als-backend and breaks the service account."
          fi

          echo "All required secrets are present."

      - name: Authorise the SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          port="${VPS_PORT:-22}"

          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" >> ~/.ssh/known_hosts
            echo "Host key pinned from VPS_HOST_KEY."
            exit 0
          fi

          echo "::warning::VPS_HOST_KEY is not set. This run trusts whatever answers at $VPS_HOST:$port — pin it with the line printed below."

          # `-p` matters: without it this always scans 22 while the deploy step
          # below connects on VPS_PORT, so a server on a non-standard port
          # fails here and nowhere else.
          #
          # stderr is kept. Swallowing it with 2>/dev/null is what turned every
          # failure of this command into a bare "exit code 1".
          if ! ssh-keyscan -p "$port" -t rsa,ecdsa,ed25519 "$VPS_HOST" > /tmp/hostkeys; then
            echo "::error::Could not read a host key from $VPS_HOST:$port."
            echo "Usually one of:"
            echo "  · VPS_HOST is wrong or does not resolve"
            echo "  · sshd listens on another port — set the VPS_PORT secret"
            echo "  · a firewall is refusing GitHub's runners"
            exit 1
          fi

          # keyscan can exit 0 having printed only comment lines, which would
          # leave known_hosts effectively empty and fail later as a host key
          # mismatch rather than as the empty scan it actually was.
          if ! grep -qv '^#' /tmp/hostkeys; then
            echo "::error::$VPS_HOST:$port answered but offered no host key."
            exit 1
          fi

          cat /tmp/hostkeys >> ~/.ssh/known_hosts

          echo ""
          echo "Pin this by storing it as the VPS_HOST_KEY secret:"
          grep -v '^#' /tmp/hostkeys | grep ed25519 || grep -v '^#' /tmp/hostkeys
          echo ""
          echo "Confirm it against the server before trusting it:"
          echo "  cat /etc/ssh/ssh_host_ed25519_key.pub"

      # The commit is passed explicitly rather than letting the server take
      # whatever origin/master points at, so a push that lands while this runs
      # cannot slip an untested commit into the deploy.
      # Breaks a bootstrap deadlock, and is otherwise a no-op.
      #
      # The remote-repair logic lives in scripts/deploy.sh — but that file is on
      # the server, and the server gets new versions of it by fetching from the
      # repository, which is the thing that is broken. So a server whose remote
      # has stopped working can never receive the fix that would repair it.
      #
      # This step runs from the runner instead, over the SSH connection that
      # already works. It only rewrites a remote that cannot fetch, so a private
      # repo using an SSH deploy key is untouched.
      - name: Make sure the server can reach the repository
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          ssh -p "${VPS_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              "set -e
               cd /opt/als-backend
               current=\$(git remote get-url origin)
               if git fetch --quiet origin 2>/dev/null; then
                 echo \"remote is fine: \$current\"
               else
                 echo \"remote \$current cannot fetch — repointing at $REPO_URL\"
                 git remote set-url origin '$REPO_URL'
                 git fetch --quiet origin
                 echo 'repaired.'
               fi"

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GIT_SHA: ${{ github.sha }}
          # The repository this run belongs to, as an anonymous-clonable URL.
          #
          # Passed so the server deploys from whatever repo actually ran these
          # tests, rather than from whatever it was cloned from months ago. It
          # is only used as a fallback when the configured remote fails, so a
          # private repo with a working SSH deploy key is left alone —
          # see "Reconciling the remote" in scripts/deploy.sh.
          #
          # This also self-heals a rename or a transfer between owners, which
          # is otherwise a silent breakage: git follows GitHub's redirect for a
          # while and then stops.
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          ssh -p "${VPS_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              "bash /opt/als-backend/scripts/deploy.sh '$GIT_SHA' '$REPO_URL'"

      # Closes the loop. `deploy.sh` succeeding means the process restarted, not
      # that it can serve — a bad DATABASE_URL or a missing JWT_SECRET in
      # production produces a container that exits on boot, and without this the
      # run would still go green.
      #
      # /ready is the readiness probe: it checks the database and nothing else.
      # /health deliberately does not touch Postgres, so it would answer even
      # from a process that cannot serve a single real request.
      - name: Check the service came back
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # A repository *variable*, not a secret — a public URL is not one, and
          # keeping it visible means the log can print what it checked.
          #   Settings > Secrets and variables > Actions > Variables
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          # VPS_HOST may legitimately be a bare IP, and `https://<ip>/` fails
          # certificate verification against a name-based certificate. So the
          # public URL is its own setting, and VPS_HOST is only the fallback for
          # the common case where it is already the domain.
          base="${PUBLIC_BASE_URL:-https://$VPS_HOST}"
          base="${base%/}"

          # Caught up front, because the symptom otherwise is six rounds of
          # "HTTP 000" with nothing saying why. curl exits 60 on a certificate
          # whose name does not match, and 000 is just "no response at all".
          host="${base#*://}"
          host="${host%%/*}"
          case "$host" in
            *[0-9].[0-9]*)
              if printf '%s' "$host" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
                echo "::error::The readiness check is pointed at an IP address ($host)."
                echo "HTTPS to a bare IP fails certificate verification, so this"
                echo "would report HTTP 000 no matter how healthy the service is."
                echo ""
                echo "Set a repository VARIABLE (not a secret):"
                echo "  Settings > Secrets and variables > Actions > Variables"
                echo "  PUBLIC_BASE_URL = https://als.ardena.xyz"
                echo ""
                echo "The deploy itself already succeeded — only this check is"
                echo "misconfigured."
                exit 1
              fi
              ;;
          esac

          echo "Checking $base/ready"

          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/ready -w '%{http_code}' --max-time 10 \
                   "$base/ready" || echo 000)

            if [ "$code" = "200" ]; then
              echo "Ready after ${attempt} attempt(s): $(cat /tmp/ready)"
              exit 0
            fi

            echo "Attempt $attempt: HTTP $code — waiting for the service to come up."
            sleep 5
          done

          echo "::error::$base did not become ready after the deploy."
          echo "Last response: $(cat /tmp/ready 2>/dev/null || echo '(none)')"
          echo ""
          # A 404 is a specific and useful signal here, not a generic failure:
          # /ready exists in this commit, so a 404 means the process serving
          # traffic is still running older code — the restart did not take.
          if [ "$code" = "404" ]; then
            echo "A 404 means the running process predates /ready — the restart"
            echo "did not pick up this commit. Check what the service is on:"
            echo "  ssh $VPS_USER@$VPS_HOST 'cd /opt/als-backend && git rev-parse HEAD'"
            echo ""
          fi
          echo "Check the service's own account of why:"
          echo "  ssh $VPS_HOST 'journalctl -u als-backend -n 50 --no-pager'"
          echo ""
          echo "A process that exits on boot is usually a fatal misconfiguration:"
          echo "a default JWT_SECRET or DEBUG left on in production. Missing"
          echo "integration keys do not stop the service — they are logged as"
          echo "feature_unavailable and the affected endpoints refuse."
          exit 1
