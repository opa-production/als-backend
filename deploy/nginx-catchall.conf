# The default server: everything that did not ask for the domain by name.
#
# A request arriving at the bare IP, or with someone else's Host header, is not
# a student's app and never has been. What it is, in practice, is the constant
# background of scanners looking for `phpunit/eval-stdin.php`, `/containers/json`
# and a WordPress admin — every one of which reached FastAPI, was routed, logged
# as a 404, and buried the real traffic in `journalctl`.
#
# nginx sends the request to the `default_server` for the port when no
# `server_name` matches. Without one declared, that role falls to the first
# block nginx parsed, which is the API — which is how these ended up in the
# application log. This file claims the role and answers with 444: nginx closes
# the connection with no response at all. A scanner learns nothing, and nothing
# is written to the app's log.
#
# In its own file, deliberately. `nginx.conf` in this directory is rewritten in
# place by certbot, and re-installing it is a documented step; this must survive
# both. Installed as `als-catchall` and symlinked, per DEPLOYMENT.md section 2.
#
# NOTE: Debian and Ubuntu ship an enabled site at /etc/nginx/sites-enabled/default
# that already claims `listen 80 default_server`. Two blocks claiming it is a
# `nginx -t` failure, not a silent conflict, so remove that symlink first:
#
#     sudo rm -f /etc/nginx/sites-enabled/default

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # The name that matches nothing. A Host header is compared against
    # `server_name` values, and `_` is not a valid hostname, so this block is
    # only ever reached by being the default.
    server_name _;

    access_log off;
    server_tokens off;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Refuses the TLS handshake outright, before any certificate is needed —
    # which is the point, since this block has no domain and so no certificate
    # of its own. Presenting the API's certificate to a scanner that connected
    # by IP would be the alternative, and it would tell them the domain.
    #
    # Requires nginx 1.19.4 or newer (`nginx -v`). Ubuntu 22.04 ships 1.18: on
    # that, delete this line and point ssl_certificate/ssl_certificate_key at
    # the certbot paths from the API site instead, then `return 444;`.
    ssl_reject_handshake on;

    access_log off;
    server_tokens off;
}
