# nginx site for the ALS API.
#
# Installed by hand to /etc/nginx/sites-available/als-backend, substituting
# __DOMAIN__ on the way — see DEPLOYMENT.md section 2.
#
# This is the plain-HTTP form. Run certbot after installing it:
#
#     sudo certbot --nginx -d __DOMAIN__
#
# certbot rewrites this file in place to add the 443 server block, the
# certificate paths and the HTTP->HTTPS redirect. Do not hand-edit it after
# that; edit here, re-install it with the sed from DEPLOYMENT.md, then certbot
# again.

# Brute-force protection for the admin sign-in form.
#
# This file is included from inside `http {}`, which is the only context
# `limit_req_zone` is allowed in. Rate limiting lives here rather than in the
# application because it has to reject the request before it costs a worker:
# the password KDF is deliberately ~100ms, so an unthrottled login endpoint is
# also a way to occupy every worker in the pool.
#
# Per IP, not per account. An account-keyed limit is a way to lock a real admin
# out by guessing at their email, which turns a defence into a denial of
# service.
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;

upstream als_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Sync pushes a batch of records at a time. Files never come through here —
    # they go straight to Supabase Storage on a signed URL — so this only has
    # to cover JSON.
    client_max_body_size 10m;

    # Nothing about the upstream is a client's business.
    server_tokens off;
    proxy_hide_header X-Powered-By;

    access_log /var/log/nginx/als-backend.access.log;
    error_log  /var/log/nginx/als-backend.error.log;

    location / {
        proxy_pass http://als_api;
        proxy_http_version 1.1;

        # Required for the keepalive pool above: the default Connection: close
        # would tear down a connection per request.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Outbound calls to Kora and Supabase are bounded at 15s by
        # HTTP_TIMEOUT_SECONDS; this sits just above so nginx reports the
        # upstream's own error rather than pre-empting it with a 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
    }

    # Ten attempts a minute per address, with a small burst so a mistyped
    # password twice in a row is not a lockout. `nodelay` serves the burst
    # immediately and only then starts refusing — queuing them would hold
    # connections open, which is the thing being defended against.
    location = /api/v1/admin/auth/login {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://als_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The health endpoint is for the deploy script and any uptime monitor.
    # Kept out of the access log so it does not drown real traffic.
    location = /health {
        proxy_pass http://als_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
