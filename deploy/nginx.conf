# nginx site for the ALS API. Installed to /etc/nginx/sites-available/als-backend
# by scripts/provision.sh, which substitutes __DOMAIN__.
#
# This is the plain-HTTP form. Run certbot after installing it:
#
#     sudo certbot --nginx -d __DOMAIN__
#
# certbot rewrites this file in place to add the 443 server block, the
# certificate paths and the HTTP->HTTPS redirect. Do not hand-edit it after
# that; edit here and re-run provision.sh, then certbot again.

upstream als_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Sync pushes a batch of records at a time. Files never come through here —
    # they go straight to Supabase Storage on a signed URL — so this only has
    # to cover JSON.
    client_max_body_size 10m;

    # Nothing about the upstream is a client's business.
    server_tokens off;
    proxy_hide_header X-Powered-By;

    access_log /var/log/nginx/als-backend.access.log;
    error_log  /var/log/nginx/als-backend.error.log;

    location / {
        proxy_pass http://als_api;
        proxy_http_version 1.1;

        # Required for the keepalive pool above: the default Connection: close
        # would tear down a connection per request.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Outbound calls to Paystack and Supabase are bounded at 15s by
        # HTTP_TIMEOUT_SECONDS; this sits just above so nginx reports the
        # upstream's own error rather than pre-empting it with a 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
    }

    # The health endpoint is for the deploy script and any uptime monitor.
    # Kept out of the access log so it does not drown real traffic.
    location = /health {
        proxy_pass http://als_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
