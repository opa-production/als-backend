[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "als-backend"
version = "0.1.0"
description = "Ardena Learning System — API"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # asyncpg, not psycopg2: every database call in this service is awaited.
  "asyncpg>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # One shared async client for Supabase, Kora and the AI providers.
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.4",
  # PDF text extraction, in the worker. Pure Python — no compiled extension to
  # fail on a box that has no build toolchain, and none to be blocked by a
  # Windows code-signing policy either, which is what ruled LangChain out.
  "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "aiosqlite>=0.20",
  # alembic.ini sets `timezone = UTC`, which resolves through zoneinfo. Linux
  # has a system tz database; Windows does not, and `alembic revision` there
  # dies with "Can't locate timezone: UTC" until this is installed.
  "tzdata>=2024.2",
  # Builds the PDFs the extraction tests read. Test-only: nothing in the
  # service ever writes a PDF.
  "reportlab>=4.0",
]

# `app` is the only importable package. Without this, setuptools tries to
# auto-discover and gives up on a tree that also holds alembic/, tests/ and
# scripts/ at the top level.
[tool.setuptools.packages.find]
# `packages = ["app"]` installs the top-level package and none of its
# subpackages, so site-packages ends up with app/ but no app.db, app.api or
# app.services. Nothing noticed for a long time: uvicorn and pytest both put the
# working directory on sys.path, so the source tree shadowed the broken install
# every time it mattered. It surfaced the first time something ran from another
# directory -- scripts/create_admin.py -- as ModuleNotFoundError: app.db.
include = ["app*"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
