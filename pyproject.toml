[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "als-backend"
version = "0.1.0"
description = "Ardena Learning System — API"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # asyncpg, not psycopg2: every database call in this service is awaited.
  "asyncpg>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # One shared async client for Supabase and Paystack.
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "aiosqlite>=0.20",
]

# `app` is the only importable package. Without this, setuptools tries to
# auto-discover and gives up on a tree that also holds alembic/, tests/ and
# scripts/ at the top level.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
